global
  log stdout format raw local0
  maxconn 512
  ssl-default-bind-options ssl-min-ver TLSv1.2
  ssl-default-server-options ssl-min-ver TLSv1.2
defaults
  mode http
  log global
  log-format "%ci:%cp %HM %HP %ST %b/%s"
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout check 5s
resolvers docker
  nameserver dns 127.0.0.11:53
  accepted_payload_size 8192
  hold valid 2s
  hold obsolete 2s
frontend https
  bind :443 ssl crt /certificates/ingress.pem
  http-request del-header Forwarded
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Host
  http-request del-header X-Forwarded-Proto
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-For %[src]
  acl identity hdr(host),field(1,:) -i "${IDENTITY_HOST}"
  acl portal hdr(host),field(1,:) -i "${PORTAL_HOST}"
  acl eden hdr(host),field(1,:) -i "${EDEN_HOST}"
  http-request deny deny_status 400 if identity { path_sub % .. }
  http-request deny deny_status 403 if identity !{ path_beg /realms/ /resources/ }
  http-request deny deny_status 421 unless identity or portal or eden
  use_backend identity if identity
  use_backend eden if eden
  use_backend gateway if portal { path_beg /api/ /health }
  use_backend portal if portal
frontend administration
  bind :9443 ssl crt /certificates/ingress.pem
  default_backend identity
backend portal
  balance roundrobin
  option httpchk GET /Cuenta/Desconectado
  http-check expect status 200
  http-response set-header X-Deployment-Node portal/%[srv_name]
  server-template web 1-4 presentation:8443 check ssl verify required ca-file /trust/ca-bundle.crt verifyhost "${PORTAL_HOST}" sni env(PORTAL_HOST) resolvers docker init-addr none
backend gateway
  timeout check 1s
  default-server inter 1s fall 2 rise 2
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  http-response set-header X-Deployment-Node gateway/%[srv_name]
  server-template gw 1-4 gateway:8080 check resolvers docker init-addr none
backend identity
  option httpchk GET /health/ready
  http-check expect status 200
  server kc keycloak:8443 ssl verify required ca-file /trust/ca-bundle.crt verifyhost "${IDENTITY_HOST}" sni env(IDENTITY_HOST) check port 9000 no-check-ssl resolvers docker init-addr none
backend eden
  option httpchk GET /eden_default/default/index
  http-check expect status 200
  server eden eden:8000 check resolvers docker init-addr none

name: platform-identity
services:
  database:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?External database password required}
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: [start, --db=postgres, --health-enabled=true]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?External database password required}
      KC_DB_POOL_INITIAL_SIZE: '2'
      KC_DB_POOL_MIN_SIZE: '2'
      KC_DB_POOL_MAX_SIZE: '10'
      KC_HOSTNAME: ${KC_PUBLIC_URL:?HTTPS issuer origin required}
      KC_HTTPS_CERTIFICATE_FILE: /certificates/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certificates/server.key
      KC_CACHE: ispn
      KC_CACHE_STACK: jdbc-ping
    volumes:
      - ${KC_CERTIFICATE_DIR:?External certificate directory required}:/certificates:ro
    ports:
      - '127.0.0.1:${KC_HTTPS_PORT:-18443}:8443'
volumes:
  identity-data:
